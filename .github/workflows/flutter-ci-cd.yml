name: Flutter CI/CD Pipeline
on:
  push:
    tags:
      - 'v*' # Triggers workflow on version tags (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Run Unit Tests
        run: flutter test test/domain/utils/

      - name: Auto-generate Issue on Failure
        if: failure()
        run: |
          gh issue create \
            --title "🚨 CI Pipeline Failure: Unit Tests" \
            --body "Unit tests failed during run **${{ github.run_id }}** on tag \`${{ github.ref_name }}\`. [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Release APK
        run: flutter build apk --release
      
      - name: Prepare Artifact
        run: |
          mkdir -p release-artifacts
          mv build/app/outputs/flutter-apk/app-release.apk release-artifacts/DailyFlow-Android-${{ github.ref_name }}.apk
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-release
          path: release-artifacts/

  build-ios:
    name: 🍎 Build iOS IPA
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build iOS (Unsigned)
        run: flutter build ios --release --no-codesign
      
      - name: Package IPA
        run: |
          mkdir -p release-artifacts/Payload
          mv build/ios/iphoneos/Runner.app release-artifacts/Payload/
          cd release-artifacts
          zip -r DailyFlow-iOS-Unsigned-${{ github.ref_name }}.ipa Payload
          rm -rf Payload
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-release
          path: release-artifacts/

  create-release:
    name: 🚀 Publish Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v3
        with:
          name: android-release
          path: release-artifacts/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v3
        with:
          name: ios-release
          path: release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}
            
            **Assets included:**
            - Android APK
            - iOS IPA (Unsigned)
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
