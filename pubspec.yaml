name: dailyflow
description: A privacy-first, fully offline habit tracker, Eisenhower matrix-based agenda, and secure journaling application.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Database (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Security & Authentication
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8

  # Utilities
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6
  cryptography: ^2.9.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  
  # assets:
  #  - assets/images/
